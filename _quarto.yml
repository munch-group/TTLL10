project:
  type: book
    
execute:
  freeze: auto
  echo: true
      
format:
  html:
    theme: 
      - default
      - custom.scss
    toc-depth: 2
    notebook-links: true
    number-sections: false  
    reference-location: margin
    mermaid:
      theme: neutral

comments:
  hypothesis: true

lightbox: true

book:
  repo-url: "https://github.com/munch-group/TTLL10"
  repo-actions: [edit, issue, source]  
  title: "TTLL10"
  author: "Kasper Munch"  
  sidebar:
    collapse-level: 1
    search: true  
  chapters:
    - index.qmd
    - part: "Notebooks"
      chapters: 
      - notebooks/ttll10_structure.ipynb
    - part: "Workflows"
      chapters: 
      - workflow.py
     
bibliography: references.bib

